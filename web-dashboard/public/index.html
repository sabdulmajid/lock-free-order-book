<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Book Terminal</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="terminal">
      <section class="pane instrument-strip" aria-label="Instrument and system state">
        <div class="instrument-cell symbol-cell">
          <select id="stock-selector" class="stock-dropdown" aria-label="Symbol">
            <option value="AAPL">AAPL</option>
            <option value="GOOGL">GOOGL</option>
            <option value="AMZN">AMZN</option>
            <option value="META">META</option>
            <option value="MSFT">MSFT</option>
            <option value="NVDA">NVDA</option>
            <option value="TSLA">TSLA</option>
          </select>
          <span id="current-price" class="last-price">0.00</span>
        </div>
        <div class="instrument-cell connection-cell">
          <span id="connection-status" class="status-dot"></span>
          <span id="connection-text">DISCONNECTED</span>
        </div>
        <div class="instrument-cell">
          <span class="label">ORD</span>
          <span id="total-orders" class="value">0</span>
        </div>
        <div class="instrument-cell">
          <span class="label">TRD</span>
          <span id="total-trades" class="value">0</span>
        </div>
        <div class="instrument-cell">
          <span class="label">VOL</span>
          <span id="volume" class="value">0</span>
        </div>
        <div class="instrument-cell">
          <span class="label">OPS</span>
          <span id="throughput" class="value">0</span>
        </div>
        <div class="instrument-cell">
          <span class="label">LEAD</span>
          <span id="performance-winner" class="value">-</span>
        </div>
        <div class="instrument-cell">
          <span class="label">DELTA</span>
          <span id="speed-difference" class="value">-</span>
        </div>
      </section>

      <section class="pane depth-pane" aria-label="Depth book">
        <div class="pane-title">
          <span>DEPTH</span>
          <span id="spread">SPREAD 0.00</span>
        </div>
        <div class="depth-grid column-row">
          <span>PX</span>
          <span>SZ</span>
          <span>NOTIONAL</span>
        </div>
        <div id="asks-list" class="book-side asks"></div>
        <div class="spread-row">
          <span>BID</span>
          <span>ASK</span>
          <span>EDGE</span>
        </div>
        <div id="bids-list" class="book-side bids"></div>
      </section>

      <section class="pane trades-pane" aria-label="Trade ticker">
        <div class="pane-title">
          <span>TIME SALES</span>
          <span>LAST 32</span>
        </div>
        <div class="trade-row trade-columns">
          <span>TIME</span>
          <span>PX</span>
          <span>SZ</span>
        </div>
        <div id="trades-list" class="trades-list"></div>
      </section>

      <section class="pane perf-pane" aria-label="Engine performance">
        <div class="pane-title">
          <span>ENGINE PERF</span>
          <span>RUST / CXX</span>
        </div>
        <div class="perf-table">
          <div class="perf-row">
            <span>RUST OPS</span>
            <span id="rust-orders-sec">0</span>
            <span>LAT</span>
            <span id="rust-latency">0us</span>
            <span>MEM</span>
            <span id="rust-memory">0MB</span>
          </div>
          <div class="perf-row">
            <span>CXX OPS</span>
            <span id="cpp-orders-sec">0</span>
            <span>LAT</span>
            <span id="cpp-latency">0us</span>
            <span>MEM</span>
            <span id="cpp-memory">0MB</span>
          </div>
        </div>
        <canvas id="perf-chart" class="terminal-canvas"></canvas>
      </section>

      <section class="pane price-pane" aria-label="Price path">
        <div class="pane-title">
          <span>PRICE PATH</span>
          <span id="price-sample-count">0</span>
        </div>
        <canvas id="price-chart" class="terminal-canvas"></canvas>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
